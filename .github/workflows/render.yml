name: Remotion Render Farm

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition name to render"
        required: true
        default: "HelloWorld"
      output_name:
        description: "Output filename"
        required: true
        default: "out.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render Video
        run: npx remotion render src/index.ts ${{ github.event.inputs.composition || 'HelloWorld' }} ${{ github.event.inputs.output_name || 'out.mp4' }}
        
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: ${{ github.event.inputs.output_name || 'out.mp4' }}
          retention-days: 7
