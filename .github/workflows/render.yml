name: Distributed Manim Render Farm

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render_chunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev texlive texlive-latex-extra texlive-fonts-extra texlive-latex-recommended texlive-science tipa sox libsox-fmt-all espeak libespeak1

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Render Chunk 0
        id: render
        continue-on-error: true
        env:
          CHUNK_INDEX: 0
        run: |
          manim -qm main.py VideoScript --format mp4 -o chunk_00.mp4 > error_log.txt 2>&1

      - name: Commit Log if Failed
        if: steps.render.outcome == 'failure'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add error_log.txt
          git commit -m "Auto-commit error log"
          git pull --rebase origin main
          git push

  stitch:
    needs: render_chunk
    runs-on: ubuntu-latest
    steps:
      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks_dir

      - name: Generate concat inputs.txt
        run: |
          > inputs.txt
          for i in {0..11}; do
            CHUNK_ID=$(printf "%02d" $i)
            FILE=$(find chunks_dir/chunk_$CHUNK_ID -name "chunk_$CHUNK_ID.mp4" | head -n 1)
            if [ -z "$FILE" ]; then echo "Error: Could not find chunk_$CHUNK_ID.mp4!"; exit 1; fi
            echo "file '$FILE'" >> inputs.txt
          done

      - name: Stitch video chunks
        run: ffmpeg -f concat -safe 0 -i inputs.txt -c copy final_video.mp4

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final_video
          path: final_video.mp4
          retention-days: 7
